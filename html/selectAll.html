<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="cache-control" content="no-store" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="../index.css" />
	</head>
	<body>
		<div>
			<p>
				This will create a new sequence with a randomize order of all
				the top-level items within your project folder.
			</p>
		</div>
		<div>
			<input
				type="checkbox"
				id="include-bin"
				name="all-parameters"
				value="Include bin"
			/>
			<label for="include-bin">Include bin</label>
		</div>
		<div>
			<label for="gap-all">
				Seconds between clips
				<span class="extra">&nbsp;(Default: 0)</span>:
			</label>
			<input type="number" id="gap-all" name="all-parameters" value="0" />
		</div>
		<div>
			<button
				onclick="window.location.href='../index.html'"
				id="all-back-button"
				class="back-btn"
			>
				Back
			</button>
		</div>
		<div class="big">
			<button
				onclick="selectAllItems()"
				id="all-start-button"
				class="start-btn"
			>
				Start
			</button>
		</div>
		<script type="text/javascript" src="../js/libs/CSInterface.js"></script>
		<script type="text/javascript" src="../js/index.js"></script>
	</body>
</html>
