<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="cache-control" content="no-store" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h2>File Order Randomizer</h2>
            </div>

            <!-- Selection Mode Section -->
            <div class="section">
                <h3>Selection Mode</h3>
                <div class="mode-options">
                    <label class="radio-label">
                        <input type="radio" name="mode" value="all" checked />
                        <span>All Project Items</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mode" value="bin" />
                        <span>Selected Bin</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mode" value="manual" />
                        <span>Manual Selection</span>
                    </label>
                </div>
                <div id="selection-status" class="status-box">
                    Detecting selection...
                </div>
            </div>

            <!-- Options Section -->
            <div class="section">
                <h3>Randomization Options</h3>

                <!-- Filter Type -->
                <div class="option-group">
                    <label for="filter-type">Filter by Type:</label>
                    <select id="filter-type" name="filter-type">
                        <option value="all">All Types</option>
                        <option value="video">Video Only</option>
                        <option value="audio">Audio Only</option>
                        <option value="image">Images Only</option>
                    </select>
                </div>

                <!-- Nesting Depth -->
                <div class="option-group">
                    <label for="nesting-depth">Bin Nesting Depth:</label>
                    <select id="nesting-depth" name="nesting-depth">
                        <option value="0">Current Level Only</option>
                        <option value="1">1 Level Deep</option>
                        <option value="2">2 Levels Deep</option>
                        <option value="3">3 Levels Deep</option>
                        <option value="-1">Unlimited (All Nested Bins)</option>
                    </select>
                </div>

                <!-- Gap Between Clips -->
                <div class="option-group">
                    <label for="gap-seconds"
                        >Gap Between Clips (seconds):</label
                    >
                    <input
                        type="number"
                        id="gap-seconds"
                        name="gap-seconds"
                        value="0"
                        min="0"
                        step="0.1"
                    />
                </div>

                <!-- Include Sequences -->
                <div class="option-group">
                    <label class="checkbox-label">
                        <input
                            type="checkbox"
                            id="include-sequences"
                            name="include-sequences"
                        />
                        <span
                            >Include Sequences (default: media files only)</span
                        >
                    </label>
                </div>

                <div class="divider"></div>

                <!-- Audio Handling -->
                <div class="option-group">
                    <label>Audio Handling:</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input
                                type="radio"
                                name="audio-handling"
                                value="mixed"
                                checked
                            />
                            <span>Mix Together</span>
                        </label>
                        <label class="radio-label">
                            <input
                                type="radio"
                                name="audio-handling"
                                value="separate"
                            />
                            <span>Separate Tracks</span>
                        </label>
                    </div>
                </div>

                <!-- Image Duration -->
                <div class="option-group" id="image-duration-group">
                    <label for="image-duration"
                        >Image Duration (seconds):</label
                    >
                    <input
                        type="number"
                        id="image-duration"
                        name="image-duration"
                        value="5"
                        min="0.1"
                        step="0.1"
                    />
                    <small style="display: block; margin-top: 4px; color: #888"
                        >Leave blank to use Premiere's default</small
                    >
                </div>

                <div class="divider"></div>

                <!-- Sequence Name -->
                <div class="option-group">
                    <label for="sequence-name">Sequence Name:</label>
                    <input
                        type="text"
                        id="sequence-name"
                        name="sequence-name"
                        value="Randomized Sequence"
                    />
                </div>
            </div>

            <!-- Preview Section -->
            <div class="section preview-section">
                <div id="preview-info" class="preview-box">
                    <span id="preview-icon">🎬</span>
                    <span id="preview-text">Ready to randomize</span>
                </div>
                <div id="error-message" class="error-box hidden"></div>
            </div>

            <!-- Action Button -->
            <div class="action-section">
                <button id="create-button" class="create-btn">
                    Create Randomized Sequence
                </button>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast-container" class="toast-container"></div>

        <script type="text/javascript" src="./js/libs/CSInterface.js"></script>
        <script type="text/javascript" src="./js/index.js"></script>
    </body>
</html>
