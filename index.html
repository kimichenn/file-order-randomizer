<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="cache-control" content="no-store" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h2>File Order Randomizer</h2>
            </div>

            <div class="content-grid">
                <!-- Selection Mode Section -->
                <div class="section">
                    <h3>Selection Mode</h3>
                    <div class="mode-options">
                        <label class="radio-label">
                            <input
                                type="radio"
                                name="mode"
                                value="all"
                                checked
                            />
                            <span>All Project Items</span>
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Randomizes all media files in your entire
                                    project</span
                                >
                            </span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="bin" />
                            <span>Selected Bin</span>
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Randomizes only files from the currently
                                    selected bin in Premiere Pro</span
                                >
                            </span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="mode" value="manual" />
                            <span>Manual Selection</span>
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Randomizes only the files you've manually
                                    selected in Premiere Pro</span
                                >
                            </span>
                        </label>
                    </div>
                    <div id="selection-status" class="status-box">
                        Detecting selection...
                    </div>
                </div>

                <!-- Options Section -->
                <div class="section">
                    <h3>Randomization Options</h3>

                    <!-- Filter Type -->
                    <div class="option-group">
                        <label for="filter-type">
                            Filter by Type:
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Choose which type of media to include in
                                    the randomized sequence</span
                                >
                            </span>
                        </label>
                        <select id="filter-type" name="filter-type">
                            <option value="all">All Types</option>
                            <option value="video">Video Only</option>
                            <option value="audio">Audio Only</option>
                            <option value="image">Images Only</option>
                        </select>
                    </div>

                    <!-- Nesting Depth -->
                    <div class="option-group">
                        <label for="nesting-depth">
                            Bin Nesting Depth:
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Controls how many levels of nested bins to
                                    search through. "Current Level Only" stays
                                    in the selected bin, while higher numbers
                                    include sub-bins</span
                                >
                            </span>
                        </label>
                        <select id="nesting-depth" name="nesting-depth">
                            <option value="0">Current Level Only</option>
                            <option value="1">1 Level Deep</option>
                            <option value="2">2 Levels Deep</option>
                            <option value="3">3 Levels Deep</option>
                            <option value="-1">
                                Unlimited (All Nested Bins)
                            </option>
                        </select>
                    </div>

                    <!-- Gap Between Clips -->
                    <div class="option-group">
                        <label for="gap-seconds">
                            Gap Between Clips (seconds):
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Adds empty space between each clip in the
                                    timeline. Useful for creating breathing room
                                    between clips</span
                                >
                            </span>
                        </label>
                        <input
                            type="number"
                            id="gap-seconds"
                            name="gap-seconds"
                            value="0"
                            min="0"
                            step="0.1"
                            onclick="this.select()"
                        />
                    </div>

                    <!-- Include Sequences -->
                    <div class="option-group">
                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="include-sequences"
                                name="include-sequences"
                            />
                            <span
                                >Include Sequences (default: media files
                                only)</span
                            >
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >When enabled, existing sequences will be
                                    treated as clips and included in the
                                    randomization. By default, only raw media
                                    files are included</span
                                >
                            </span>
                        </label>
                    </div>

                    <div class="divider"></div>

                    <!-- Audio Handling -->
                    <div class="option-group">
                        <label>
                            Audio Handling:
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Choose how audio clips are placed on the
                                    timeline</span
                                >
                            </span>
                        </label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="audio-handling"
                                    value="separate"
                                    checked
                                />
                                <span>Separate Tracks</span>
                                <span class="tooltip-wrapper">
                                    <span class="tooltip-icon"></span>
                                    <span class="tooltip-content"
                                        >Audio clips are placed on separate
                                        tracks below video, allowing them to
                                        play simultaneously</span
                                    >
                                </span>
                            </label>
                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="audio-handling"
                                    value="mixed"
                                />
                                <span>Mix Together</span>
                                <span class="tooltip-wrapper">
                                    <span class="tooltip-icon"></span>
                                    <span class="tooltip-content"
                                        >Audio and video clips are randomized
                                        together in chronological order on the
                                        same timeline</span
                                    >
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Image Duration -->
                    <div class="option-group" id="image-duration-group">
                        <label for="image-duration">
                            Image Duration (seconds):
                            <span class="tooltip-wrapper">
                                <span class="tooltip-icon"></span>
                                <span class="tooltip-content"
                                    >Sets how long still images appear in the
                                    timeline. Video clips use their natural
                                    duration. Leave blank to use your Premiere
                                    Pro default image duration setting</span
                                >
                            </span>
                        </label>
                        <input
                            type="number"
                            id="image-duration"
                            name="image-duration"
                            placeholder="Premiere default"
                            min="0.1"
                            step="0.1"
                            onclick="this.select()"
                        />
                        <small
                            style="display: block; margin-top: 4px; color: #888"
                            >Leave blank to use Premiere's default</small
                        >
                    </div>

                    <div class="divider"></div>

                    <!-- Sequence Name -->
                    <div class="option-group">
                        <label for="sequence-name">Sequence Name:</label>
                        <input
                            type="text"
                            id="sequence-name"
                            name="sequence-name"
                            value="Randomized Sequence"
                        />
                    </div>
                </div>

                <!-- Preview & Action Section Combined -->
                <div class="section preview-action-column">
                    <h3>Preview</h3>
                    <div id="preview-info" class="preview-box">
                        <span id="preview-icon">🎬</span>
                        <span id="preview-text">Ready to randomize</span>
                    </div>

                    <!-- File Tree Toggle -->
                    <div
                        id="file-tree-container"
                        class="file-tree-container hidden"
                    >
                        <button id="file-tree-toggle" class="file-tree-toggle">
                            <span class="toggle-icon">▶</span>
                            <span class="toggle-text">Show Files</span>
                        </button>
                        <div
                            id="file-tree-content"
                            class="file-tree-content hidden"
                        >
                            <div id="file-tree" class="file-tree"></div>
                        </div>
                    </div>

                    <div id="error-message" class="error-box hidden"></div>

                    <!-- Action Button -->
                    <div class="action-section">
                        <button id="create-button" class="create-btn">
                            Create Randomized Sequence
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast-container" class="toast-container"></div>

        <script type="text/javascript" src="./js/libs/CSInterface.js"></script>
        <script type="text/javascript" src="./js/index.js"></script>
    </body>
</html>
